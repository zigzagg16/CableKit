name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFTFORMAT_VERSION: "0.62.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: swiftformat --lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # Pinned to the version the repo is formatted with, so lint never drifts from local results.
      - run: |
          curl -sSL -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/${{ env.SWIFTFORMAT_VERSION }}/swiftformat.zip
          unzip -q swiftformat.zip && chmod +x swiftformat
      - run: ./swiftformat --version && ./swiftformat --lint .

  macos:
    name: Build & test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build
      - run: swift test

  ios:
    # Compiles the `#if os(iOS)` paths (Core Motion, UIKit haptics, the window-scene probe) that
    # `swift build` on the macOS host never sees.
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: >
          xcodebuild build
          -project CableDemo.xcodeproj
          -scheme CableKit
          -destination 'generic/platform=iOS Simulator'
          -quiet

  demo:
    name: Build demo app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: >
          xcodebuild build
          -project CableDemo.xcodeproj
          -scheme CableDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          -quiet
