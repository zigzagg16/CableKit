name: CableDemo
options:
  bundleIdPrefix: lu.nobo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  CableKit:
    path: .

targets:
  CableDemo:
    type: application
    platform: iOS
    sources:
      - path: Demo
        excludes: ["build.sh", "Info.plist"]
    dependencies:
      - package: CableKit
    info:
      path: Demo/Info.plist
      properties:
        CFBundleDisplayName: Cable Demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lu.nobo.CableDemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"

        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false

schemes:
  CableDemo:
    build:
      targets:
        CableDemo: all
    run:
      config: Debug
    archive:
      config: Release
